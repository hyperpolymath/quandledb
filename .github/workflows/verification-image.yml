# SPDX-License-Identifier: MPL-2.0
name: Julia verification image
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    name: Build and test Julia verification image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image and run embedded tests
        run: podman build --tag localhost/verification:ci --file Containerfile .
      - name: Verify image command
        run: podman run --rm --network=none localhost/verification:ci
